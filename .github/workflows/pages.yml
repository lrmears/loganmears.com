name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag noted) so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Cache busting: replace the __BUILD__ placeholder in asset URLs with this commit's short hash,
      # so every deploy gets fresh URLs and browsers/CDNs never mix old and new files.
      - name: Stamp asset URLs
        run: |
          find site -type f \( -name '*.html' -o -name '*.js' \) -exec sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" {} +
          sed -i "s/__BUILD_DATE__/$(date -u +%F)/g" site/sitemap.xml
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
